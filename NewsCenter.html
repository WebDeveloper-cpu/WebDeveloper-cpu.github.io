<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- File Title -->
  <title>NewsCenter</title>
  
  <!-- Dynamic SVG Favicon featuring an "N" -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23ff0050'/><text x='50%' y='50%' dominant-baseline='central' text-anchor='middle' fill='%23ffffff' font-family='sans-serif' font-size='65' font-weight='900'>N</text></svg>">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 0 10px;
    }

    /* Opera-Style Container */
    .app-container {
      width: 100%;
      max-width: 600px;
      background: #1e293b;
      height: 100vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    /* App Header */
    .app-header {
      background: #0f172a;
      padding: 12px 16px;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }
    .brand-icon {
      background: #ff0050;
      color: #fff;
      font-weight: 900;
      font-size: 16px;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
    }
    .brand-title {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    /* Browser Navigation Controls */
    .nav-controls {
      display: flex;
      gap: 6px;
    }
    .nav-btn {
      background: #334155;
      border: none;
      color: #f8fafc;
      width: 34px;
      height: 34px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      transition: background 0.2s;
    }
    .nav-btn:hover {
      background: #ff0050;
    }

    /* Category Navigation Bar */
    .category-bar {
      display: flex;
      overflow-x: auto;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      scrollbar-width: none;
      flex-shrink: 0;
    }
    .category-bar::-webkit-scrollbar { display: none; }
    .nav-item {
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 600;
      color: #94a3b8;
      cursor: pointer;
      white-space: nowrap;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }
    .nav-item.active {
      color: #ff0050;
      border-bottom-color: #ff0050;
    }

    /* Main Content Wrappers */
    .feed {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex-grow: 1;
      overflow-y: auto;
    }

    .iframe-view {
      display: none;
      width: 100%;
      height: 100%;
      border: none;
      background: #ffffff;
      flex-grow: 1;
    }

    /* News Card */
    .news-card {
      background: #0f172a;
      border-radius: 10px;
      padding: 14px;
      display: flex;
      gap: 12px;
      text-decoration: none;
      color: inherit;
      border: 1px solid #334155;
      cursor: pointer;
      transition: border-color 0.2s, transform 0.1s;
    }
    .news-card:hover {
      border-color: #ff0050;
    }
    .news-card:active {
      transform: scale(0.99);
    }

    .news-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .news-title {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.35;
      color: #f1f5f9;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .news-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      font-size: 12px;
      color: #64748b;
    }
    .source-tag {
      color: #ff0050;
      font-weight: 600;
    }
    .news-thumb {
      width: 95px;
      height: 75px;
      border-radius: 6px;
      object-fit: cover;
      background: #334155;
      flex-shrink: 0;
    }

    /* Skeleton Loading Effect */
    .skeleton {
      background: linear-gradient(90deg, #1e293b 25%, #334155 50%, #1e293b 75%);
      background-size: 200% 100%;
      animation: loading 1.5s infinite;
    }
    @keyframes loading {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- App Header with Controls -->
    <header class="app-header">
      <div class="brand" onclick="resetToHome()">
        <span class="brand-icon">N</span>
        <span class="brand-title">NewsCenter</span>
      </div>
      <div class="nav-controls">
        <button class="nav-btn" onclick="goBack()" title="Back">←</button>
        <button class="nav-btn" onclick="goForward()" title="Forward">→</button>
        <button class="nav-btn" onclick="refreshCurrentView()" title="Refresh">🔄</button>
      </div>
    </header>

    <!-- Category Tabs -->
    <nav class="category-bar" id="category-bar">
      <div class="nav-item active" onclick="switchTab(this, 'all')">Top Headlines</div>
      <div class="nav-item" onclick="switchTab(this, 'sports')">Sports</div>
      <div class="nav-item" onclick="switchTab(this, 'entertainment')">Entertainment</div>
      <div class="nav-item" onclick="switchTab(this, 'business')">Business</div>
      <div class="nav-item" onclick="switchTab(this, 'nigeria')">Nigeria</div>
      <div class="nav-item" onclick="switchTab(this, 'world')">BBC World</div>
      <div class="nav-item" onclick="switchTab(this, 'tech')">Tech</div>
    </nav>

    <!-- Main Feed -->
    <main id="news-feed" class="feed"></main>

    <!-- In-App Web View Frame -->
    <iframe id="web-view" class="iframe-view" src="about:blank"></iframe>
  </div>

  <script>
    // Pool of provided SmartLinks
    const SMART_LINKS = [
      "https://omg10.com/4/9300114",
      "https://omg10.com/4/9797627",
      "https://omg10.com/4/9319730",
      "https://omg10.com/4/9797691",
      "https://omg10.com/4/9312449",
      "https://omg10.com/4/9653889",
      "https://omg10.com/4/9291146",
      "https://omg10.com/4/9390162"
    ];

    let smartLinkIndex = 0;

    const feeds = {
      all: [
        { name: "BBC News", url: "https://feeds.bbci.co.uk/news/world/rss.xml" },
        { name: "Punch Nigeria", url: "https://rss.punchng.com/v1/category/latest_news" }
      ],
      sports: [
        { name: "Sky Sports", url: "https://www.skysports.com/rss/12040" },
        { name: "ESPN", url: "https://www.espn.com/espn/rss/news" }
      ],
      entertainment: [
        { name: "Billboard", url: "https://www.billboard.com/feed/" },
        { name: "Variety", url: "https://variety.com/feed/" }
      ],
      business: [
        { name: "CNBC", url: "https://search.cnbc.com/rs/search/combinedrenderer.view?partnerId=2000&keywords=business&target=all" },
        { name: "Reuters", url: "https://www.reutersagency.com/feed/?best-topics=business-finance&post_type=best" }
      ],
      nigeria: [
        { name: "Punch Nigeria", url: "https://rss.punchng.com/v1/category/latest_news" },
        { name: "Premium Times", url: "https://www.premiumtimesng.com/feed" }
      ],
      world: [
        { name: "BBC World", url: "https://feeds.bbci.co.uk/news/world/rss.xml" },
        { name: "The Guardian UK", url: "https://www.theguardian.com/world/rss" }
      ],
      tech: [
        { name: "BBC Tech", url: "https://feeds.bbci.co.uk/news/technology/rss.xml" },
        { name: "The Verge", url: "https://www.theverge.com/rss/index.xml" }
      ]
    };

    let currentCategory = 'all';
    let isIframeActive = false;
    const iframe = document.getElementById('web-view');
    const newsFeed = document.getElementById('news-feed');
    const categoryBar = document.getElementById('category-bar');

    window.addEventListener('DOMContentLoaded', () => {
      const pendingArticle = sessionStorage.getItem('pending_article_url');
      if (pendingArticle) {
        sessionStorage.removeItem('pending_article_url');
        renderInIframe(pendingArticle);
      } else {
        loadCategory('all');
      }
    });

    // Rotates through the smartlink pool for each card click
    function getNextSmartLink() {
      const selectedLink = SMART_LINKS[smartLinkIndex];
      smartLinkIndex = (smartLinkIndex + 1) % SMART_LINKS.length;
      return selectedLink;
    }

    // Save target news article link and load active SmartLink into iframe
    function handleCardClick(url) {
      sessionStorage.setItem('pending_article_url', url);
      const activeSmartLink = getNextSmartLink();
      renderInIframe(activeSmartLink);
    }

    // Load any URL straight into the iframe view below controls
    function renderInIframe(url) {
      iframe.src = url;
      newsFeed.style.display = 'none';
      categoryBar.style.display = 'none';
      iframe.style.display = 'block';
      isIframeActive = true;
    }

    // Navigation Controls
    function goBack() {
      if (isIframeActive) {
        const pendingArticle = sessionStorage.getItem('pending_article_url');
        const isCurrentFrameSmartLink = SMART_LINKS.some(link => iframe.src.includes(link.replace('https://', '')));

        if (pendingArticle && isCurrentFrameSmartLink) {
          sessionStorage.removeItem('pending_article_url');
          renderInIframe(pendingArticle);
          return;
        }

        try {
          if (iframe.contentWindow.history.length > 1) {
            iframe.contentWindow.history.back();
            return;
          }
        } catch (e) {
          // Cross-origin restriction fallback
        }

        resetToHome();
      } else {
        window.history.back();
      }
    }

    function goForward() {
      if (isIframeActive) {
        try {
          iframe.contentWindow.history.forward();
        } catch (e) {
          window.history.forward();
        }
      } else {
        window.history.forward();
      }
    }

    function refreshCurrentView() {
      if (isIframeActive) {
        iframe.src = iframe.src;
      } else {
        loadCategory(currentCategory);
      }
    }

    function resetToHome() {
      iframe.style.display = 'none';
      iframe.src = 'about:blank';
      newsFeed.style.display = 'flex';
      categoryBar.style.display = 'flex';
      isIframeActive = false;
    }

    function renderSkeletons() {
      newsFeed.innerHTML = Array(5).fill(`
        <div class="news-card">
          <div class="news-content">
            <div class="skeleton" style="height: 16px; width: 90%; margin-bottom: 8px; border-radius: 4px;"></div>
            <div class="skeleton" style="height: 16px; width: 60%; border-radius: 4px;"></div>
            <div class="skeleton" style="height: 12px; width: 30%; margin-top: 12px; border-radius: 4px;"></div>
          </div>
          <div class="news-thumb skeleton"></div>
        </div>
      `).join('');
    }

    async function loadCategory(cat) {
      currentCategory = cat;
      if (isIframeActive) resetToHome();
      renderSkeletons();
      
      const selectedSources = feeds[cat];
      let articles = [];

      try {
        const requests = selectedSources.map(source => 
          fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(source.url)}`)
            .then(res => res.json())
            .then(data => {
              if (data.status === 'ok') {
                return data.items.map(item => ({
                  title: item.title,
                  link: item.link,
                  pubDate: item.pubDate,
                  source: source.name,
                  thumbnail: item.thumbnail || item.enclosure?.link || extractImg(item.description) || 'https://images.unsplash.com/photo-1504711434969-e33886168f5c?w=150'
                }));
              }
              return [];
            })
            .catch(() => [])
        );

        const results = await Promise.all(requests);
        articles = results.flat().sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));

        if (articles.length === 0) {
          newsFeed.innerHTML = `<div style="text-align:center; padding: 40px; color: #64748b;">Unable to load news. Tap refresh to try again.</div>`;
          return;
        }

        newsFeed.innerHTML = articles.map(item => `
          <div onclick="handleCardClick('${item.link}')" class="news-card">
            <div class="news-content">
              <div class="news-title">${item.title}</div>
              <div class="news-meta">
                <span class="source-tag">${item.source}</span>
                <span>•</span>
                <span>${timeAgo(item.pubDate)}</span>
              </div>
            </div>
            <img src="${item.thumbnail}" class="news-thumb" alt="news thumbnail" onerror="this.src='https://images.unsplash.com/photo-1504711434969-e33886168f5c?w=150'">
          </div>
        `).join('');

      } catch (err) {
        newsFeed.innerHTML = `<div style="text-align:center; padding: 40px; color: #64748b;">Error connecting to news network.</div>`;
      }
    }

    function extractImg(htmlStr) {
      if (!htmlStr) return null;
      const match = htmlStr.match(/<img[^>]+src="([^">]+)"/);
      return match ? match[1] : null;
    }

    function timeAgo(dateString) {
      const now = new Date();
      const past = new Date(dateString);
      const diffInMs = now - past;
      const mins = Math.floor(diffInMs / (1000 * 60));
      const hours = Math.floor(mins / 60);

      if (mins < 60) return `${Math.max(1, mins)}m ago`;
      if (hours < 24) return `${hours}h ago`;
      return `${Math.floor(hours / 24)}d ago`;
    }

    function switchTab(element, category) {
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      element.classList.add('active');
      loadCategory(category);
    }
  </script>
</body>
</html>
