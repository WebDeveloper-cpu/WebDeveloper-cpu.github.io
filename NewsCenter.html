    async function fetchRSS(feedUrl, sourceName) {
      try {
        const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(feedUrl)}`);
        const data = await res.json();
        if (data.status === 'ok' && data.items && data.items.length > 0) {
          return data.items.map(item => ({
            title: item.title,
            link: item.link,
            pubDate: item.pubDate,
            source: sourceName,
            thumbnail: item.thumbnail || item.enclosure?.link || extractImg(item.description) || 'https://images.unsplash.com/photo-1504711434969-e33886168f5c?w=150'
          }));
        }
      } catch (e) {}

      try {
        const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(feedUrl)}`);
        const data = await res.json();
        if (data.contents) {
          const parser = new DOMParser();
          const xml = parser.parseFromString(data.contents, "text/xml");
          const items = Array.from(xml.querySelectorAll("item, entry"));
          
          return items.map(item => {
            const title = item.querySelector("title")?.textContent || "No Title";
            const link = item.querySelector("link")?.getAttribute("href") || item.querySelector("link")?.textContent || "#";
            const pubDate = item.querySelector("pubDate, updated")?.textContent || new Date().toISOString();
            const desc = item.querySelector("description, content")?.textContent || "";
            
            return {
              title,
              link,
              pubDate,
              source: sourceName,
              thumbnail: extractImg(desc) || 'https://images.unsplash.com/photo-1504711434969-e33886168f5c?w=150'
            };
          });
        }
      } catch (e) {
        return [];
      }

      return [];
    }

        let matchingBanners = AFFILIATE_BANNERS.filter(b => b.category === cat || b.category === 'all');
        // Shuffle or pick a few to scatter across the feed
        let feedItemsHTML = "";
        
        articles.forEach((item, index) => {
          feedItemsHTML += `
            <div onclick="handleCardClick('${escapeQuotes(item.link)}')" class="news-card">
              <div class="news-content">
                <div class="news-title">${escapeQuotes(item.title)}</div>
                <div class="news-meta">
                  <span class="source-tag">${item.source}</span>
                  <span>•</span>
                  <span>${timeAgo(item.pubDate)}</span>
                </div>
              </div>
              <img src="${item.thumbnail}" class="news-thumb" alt="news thumbnail" onerror="this.src='https://images.unsplash.com/photo-1504711434969-e33886168f5c?w=150'">
            </div>
          `;

          // Scatter an affiliate banner every 3-4 news items if available
          if ((index + 1) % 4 === 0 && matchingBanners.length > 0) {
            const banner = matchingBanners[Math.floor(Math.random() * matchingBanners.length)];
            feedItemsHTML += `
              <div onclick="handleAffiliateClick('${escapeQuotes(banner.url)}')" class="affiliate-banner">
                <div class="aff-header">
                  <span>✨ Partner Promotion</span>
                  <span class="aff-badge">${banner.tag}</span>
                </div>
                <div class="aff-body">
                  <div class="aff-text">
                    <h4>${escapeQuotes(banner.title)}</h4>
                    <p>${escapeQuotes(banner.desc)}</p>
                  </div>
                </div>
              </div>
            `;
          }
        });

        newsFeed.innerHTML = feedItemsHTML;

      } catch (err) {
        newsFeed.innerHTML = `<div style="text-align:center; padding: 40px; color: #64748b;">Error connecting to news network.</div>`;
      }
    }

    function extractImg(htmlStr) {
      if (!htmlStr) return null;
      const match = htmlStr.match(/<img[^>]+src=["']([^"']+)["']/);
      return match ? match[1] : null;
    }

    function escapeQuotes(str) {
      return (str || '').replace(/'/g, "\\'").replace(/"/g, "&quot;");
    }

    function timeAgo(dateString) {
      const now = new Date();
      const past = new Date(dateString);
      const diffInMs = now - past;
      if (isNaN(diffInMs)) return "recently";
      
      const mins = Math.floor(diffInMs / (1000 * 60));
      const hours = Math.floor(mins / 60);

      if (mins < 60) return `${Math.max(1, mins)}m ago`;
      if (hours < 24) return `${hours}h ago`;
      return `${Math.floor(hours / 24)}d ago`;
    }

    function switchTab(element, category) {
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      element.classList.add('active');
      loadCategory(category);
    }
  </script>
</body>
</html>
