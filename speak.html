<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voice Doc Studio</title>
  <style>
    :root {
      --bg: #f1f5f9;
      --card: #ffffff;
      --border: #cbd5e1;
      --text: #0f172a;
      --accent: #2563eb;
      --accent-active: #dc2626;
      --toolbar-bg: #f8fafc;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* App Header */
    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .doc-title {
      font-size: 1.1rem;
      font-weight: 700;
      border: none;
      outline: none;
      background: transparent;
      color: var(--text);
    }
    .doc-title:focus { border-bottom: 2px solid var(--accent); }

    /* Main Toolbar */
    .toolbar {
      background: var(--toolbar-bg);
      border-bottom: 1px solid var(--border);
      padding: 8px 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .toolbar-group {
      display: flex;
      gap: 4px;
      align-items: center;
      border-right: 1px solid var(--border);
      padding-right: 8px;
      margin-right: 4px;
    }

    button, select {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 0.875rem;
      cursor: pointer;
      font-weight: 500;
    }

    button:hover, select:hover { background: #e2e8f0; }

    .btn-dictate {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-dictate.recording {
      background: var(--accent-active);
      border-color: var(--accent-active);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.6; }
      100% { opacity: 1; }
    }

    /* Editor Container (Word Canvas Look) */
    .workspace {
      flex: 1;
      overflow-y: auto;
      padding: 30px 15px;
      display: flex;
      justify-content: center;
    }

    .editor {
      background: var(--card);
      width: 100%;
      max-width: 800px;
      min-height: 900px;
      padding: 60px;
      box-sizing: border-box;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      border-radius: 2px;
      outline: none;
      line-height: 1.6;
      font-size: 1.05rem;
    }

    /* Footer Bar */
    footer {
      background: var(--card);
      border-top: 1px solid var(--border);
      padding: 8px 20px;
      font-size: 0.8rem;
      color: #64748b;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>

  <header>
    <input type="text" id="docTitle" class="doc-title" value="Untitled Document" />
    <div>
      <button onclick="exportHTML()">Export HTML</button>
      <button onclick="exportTXT()">Export Text</button>
      <button onclick="window.print()">Print / PDF</button>
    </div>
  </header>

  <div class="toolbar">
    <!-- Dictation Control -->
    <div class="toolbar-group">
      <button id="dictateBtn" class="btn-dictate" onclick="toggleDictation()">
        🎙️ <span id="dictateLabel">Start Dictation</span>
      </button>
      <select id="langSelect">
        <option value="en-US">English (US)</option>
        <option value="en-GB">English (UK)</option>
        <option value="es-ES">Spanish</option>
        <option value="fr-FR">French</option>
        <option value="de-DE">German</option>
      </select>
    </div>

    <!-- Text Styles -->
    <div class="toolbar-group">
      <button onclick="format('bold')"><b>B</b></button>
      <button onclick="format('italic')"><i>I</i></button>
      <button onclick="format('underline')"><u>U</u></button>
      <button onclick="format('strikeThrough')"><s>S</s></button>
    </div>

    <!-- Alignment -->
    <div class="toolbar-group">
      <button onclick="format('justifyLeft')">⬅️ Left</button>
      <button onclick="format('justifyCenter')">↔️ Center</button>
      <button onclick="format('justifyRight')">➡️ Right</button>
    </div>

    <!-- Lists & Formatting -->
    <div class="toolbar-group">
      <button onclick="format('insertUnorderedList')">• Bullet List</button>
      <button onclick="format('insertOrderedList')">1. Numbered List</button>
      <select onchange="formatBlock(this.value)">
        <option value="p">Paragraph</option>
        <option value="h1">Heading 1</option>
        <option value="h2">Heading 2</option>
        <option value="h3">Heading 3</option>
      </select>
    </div>
  </div>

  <div class="workspace">
    <div id="editor" class="editor" contenteditable="true" spellcheck="true">
      <p>Start typing here or click <b>Start Dictation</b> to write with your voice...</p>
    </div>
  </div>

  <footer>
    <span id="status">Status: Ready</span>
    <span>
      <span id="wordCount">0 words</span> | 
      <span id="charCount">0 characters</span>
    </span>
  </footer>

<script>
  const editor = document.getElementById('editor');
  const dictateBtn = document.getElementById('dictateBtn');
  const dictateLabel = document.getElementById('dictateLabel');
  const statusText = document.getElementById('status');
  const langSelect = document.getElementById('langSelect');
  const wordCount = document.getElementById('wordCount');
  const charCount = document.getElementById('charCount');

  let recognition;
  let isListening = false;

  // Initialize Web Speech API
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    statusText.innerText = "Error: Web Speech API unsupported. Use Chrome, Edge, or Safari.";
    dictateBtn.disabled = true;
  } else {
    recognition = new SpeechRecognition();
    recognition.continuous = true;
    recognition.interimResults = true;

    recognition.onstart = () => {
      isListening = true;
      dictateBtn.classList.add('recording');
      dictateLabel.innerText = "Stop Dictation";
      statusText.innerText = "Status: Listening...";
    };

    recognition.onresult = (event) => {
      let finalSpeech = '';
      for (let i = event.resultIndex; i < event.results.length; i++) {
        if (event.results[i].isFinal) {
          finalSpeech += event.results[i][0].transcript + ' ';
        }
      }

      if (finalSpeech) {
        // Insert voice text at cursor position or append to editor
        editor.focus();
        document.execCommand('insertText', false, finalSpeech);
        updateCounters();
      }
    };

    recognition.onerror = (event) => {
      console.error(event.error);
      statusText.innerText = `Speech Error: ${event.error}`;
      stopDictation();
    };

    recognition.onend = () => {
      if (isListening) {
        recognition.start(); // Keep listening through silent pauses
      } else {
        stopDictation();
      }
    };
  }

  async function toggleDictation() {
    if (!recognition) return;

    if (!isListening) {
      try {
        await navigator.mediaDevices.getUserMedia({ audio: true });
        recognition.lang = langSelect.value;
        recognition.start();
      } catch (err) {
        statusText.innerText = "Error: Microphone permission denied.";
      }
    } else {
      isListening = false;
      recognition.stop();
      stopDictation();
    }
  }

  function stopDictation() {
    isListening = false;
    dictateBtn.classList.remove('recording');
    dictateLabel.innerText = "Start Dictation";
    statusText.innerText = "Status: Ready";
  }

  // Formatting Controls
  function format(command, value = null) {
    document.execCommand(command, false, value);
    editor.focus();
  }

  function formatBlock(tag) {
    document.execCommand('formatBlock', false, `<${tag}>`);
    editor.focus();
  }

  // Word & Character Counter
  function updateCounters() {
    const text = editor.innerText.trim();
    const words = text ? text.split(/\s+/).length : 0;
    const chars = text.length;

    wordCount.innerText = `${words} words`;
    charCount.innerText = `${chars} characters`;
  }

  editor.addEventListener('input', updateCounters);
  updateCounters();

  // Export Document Features
  function exportTXT() {
    const title = document.getElementById('docTitle').value || 'document';
    const blob = new Blob([editor.innerText], { type: 'text/plain' });
    downloadFile(blob, `${title}.txt`);
  }

  function exportHTML() {
    const title = document.getElementById('docTitle').value || 'document';
    const blob = new Blob([editor.innerHTML], { type: 'text/html' });
    downloadFile(blob, `${title}.html`);
  }

  function downloadFile(blob, filename) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
  }
</script>
</body>
</html>
